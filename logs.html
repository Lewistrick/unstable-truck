<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event log — Unstable Truck</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 20px;
      background: #0f1216;
      color: #d6dbe2;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 14px;
    }
    h1 { font-size: 15px; font-weight: 600; color: #f0f2f5; margin: 0; }
    .back-btn {
      flex: none;
      padding: 6px 14px;
      font: inherit;
      color: #d6dbe2;
      text-decoration: none;
      background: #1c222b;
      border: 1px solid #2c3542;
      border-radius: 6px;
    }
    .back-btn:hover { background: #232b36; }
    table { border-collapse: collapse; width: 100%; }
    th, td {
      text-align: left;
      padding: 6px 12px 6px 0;
      border-bottom: 1px solid #1e242d;
      white-space: nowrap;
    }
    th { color: #8a94a3; font-weight: 600; }
    td.seed, td.player { white-space: normal; word-break: break-all; }
    td.comment { white-space: normal; word-break: break-word; color: #b6bec9; }
    .s-finished { color: #55e08a; }
    .s-cargo_fell_off { color: #ff6f6f; }
    .s-out_of_bounds { color: #f2c14e; }
    .s-started { color: #8a94a3; }
    .s-meta { color: #8fa0c0; } /* non-run events: navigation, pause, replay, help, username */
    #more {
      margin: 18px 0 0;
      padding: 8px 18px;
      font: inherit;
      color: #d6dbe2;
      background: #1c222b;
      border: 1px solid #2c3542;
      border-radius: 6px;
      cursor: pointer;
    }
    #more:hover { background: #232b36; }
    #more[disabled] { opacity: 0.5; cursor: default; }
    #status { color: #8a94a3; margin-top: 12px; }
    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    #filters label {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 0.85rem;
      color: #8a94a3;
    }
    #filters input {
      padding: 5px 8px;
      font: inherit;
      font-size: 0.85rem;
      color: #d6dbe2;
      background: #10141a;
      border: 1px solid #2c3542;
      border-radius: 6px;
      min-width: 170px;
    }
    #filter-clear {
      padding: 5px 10px;
      font: inherit;
      font-size: 0.85rem;
      color: #d6dbe2;
      background: #1c222b;
      border: 1px solid #2c3542;
      border-radius: 6px;
      cursor: pointer;
    }
    #filter-clear:hover { background: #232b36; }
    td.player { cursor: pointer; }
    td.player:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <header>
    <h1>Event log — newest first</h1>
    <a class="back-btn" href=".">← Back to game</a>
  </header>
  <div id="filters">
    <label>Include player
      <input type="text" id="filter-include" placeholder="e.g. Racer, Stranger" autocomplete="off" />
    </label>
    <label>Exclude player
      <input type="text" id="filter-exclude" placeholder="e.g. Lewistrick" autocomplete="off" />
    </label>
    <button id="filter-clear" type="button">Clear</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Player</th>
        <th>Seed</th>
        <th>Status</th>
        <th>Collected</th>
        <th>Comment</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="status"></p>
  <button id="more" type="button">Show 100 more</button>

  <script>
    const PAGE = 100;
    // Statuses that describe an actual run (the only ones where "collected" applies).
    const RUN_OUTCOMES = new Set(["started", "finished", "cargo_fell_off", "out_of_bounds"]);
    const rowsEl = document.getElementById("rows");
    const moreBtn = document.getElementById("more");
    const statusEl = document.getElementById("status");
    const includeEl = document.getElementById("filter-include");
    const excludeEl = document.getElementById("filter-exclude");
    const clearBtn = document.getElementById("filter-clear");
    const FILTER_KEY = "unstable-truck:log-filter";
    // Every row fetched so far. Filtering happens over this rather than over the
    // DOM, so changing a filter re-renders from data instead of hunting for
    // rows to unhide.
    const allRows = [];
    let offset = 0;
    let loading = false;

    function cell(text, className) {
      const td = document.createElement("td");
      td.textContent = text;
      if (className) td.className = className;
      return td;
    }

    /** Comma-separated, case-insensitive substring terms. "Racer, Strange"
     *  matches both Racer1234 and Stranger2. */
    function terms(input) {
      return input.value.toLowerCase().split(",").map((t) => t.trim()).filter(Boolean);
    }

    function visible(row) {
      const player = row.nickname.toLowerCase();
      const inc = terms(includeEl);
      const exc = terms(excludeEl);
      // Exclude wins: it's the one you reach for to hide your own testing, and
      // it should hold even if a broad include would otherwise match.
      if (exc.some((t) => player.includes(t))) return false;
      return inc.length === 0 || inc.some((t) => player.includes(t));
    }

    function render() {
      rowsEl.textContent = "";
      let shown = 0;
      for (const r of allRows) {
        if (!visible(r)) continue;
        shown++;
        const tr = document.createElement("tr");
        const when = new Date(r.createdAt);
        tr.appendChild(cell(isNaN(when) ? r.createdAt : when.toLocaleString()));
        const isRun = RUN_OUTCOMES.has(r.status);
        const player = cell(r.nickname, "player");
        // Click a name to isolate that player; click again to clear.
        player.title = "Click to filter to this player";
        player.addEventListener("click", () => {
          includeEl.value = includeEl.value === r.nickname ? "" : r.nickname;
          onFilterChange();
        });
        tr.appendChild(player);
        tr.appendChild(cell(r.seed, "seed"));
        tr.appendChild(cell(r.status, isRun ? "s-" + r.status : "s-meta"));
        tr.appendChild(cell(isRun ? String(r.collected) : ""));
        tr.appendChild(cell(r.comment ?? "", "comment"));
        rowsEl.appendChild(tr);
      }
      if (allRows.length === 0) {
        statusEl.textContent = "No runs logged yet.";
      } else if (shown === allRows.length) {
        statusEl.textContent = `${allRows.length} row(s) loaded`;
      } else {
        // Filtering only sees what's been fetched, so say so - otherwise an
        // empty-looking result reads as "no such player" when it may just be
        // further down the log.
        statusEl.textContent = `${shown} of ${allRows.length} loaded row(s) shown — filters apply to loaded rows only`;
      }
    }

    function onFilterChange() {
      localStorage.setItem(FILTER_KEY, JSON.stringify({ inc: includeEl.value, exc: excludeEl.value }));
      render();
    }

    // Filters persist: the usual reason to set one is to hide your own testing,
    // and retyping that on every visit would get old fast.
    try {
      const saved = JSON.parse(localStorage.getItem(FILTER_KEY) || "{}");
      includeEl.value = saved.inc || "";
      excludeEl.value = saved.exc || "";
    } catch {
      /* ignore a corrupt entry and start with empty filters */
    }

    includeEl.addEventListener("input", onFilterChange);
    excludeEl.addEventListener("input", onFilterChange);
    clearBtn.addEventListener("click", () => {
      includeEl.value = "";
      excludeEl.value = "";
      onFilterChange();
    });

    async function loadMore() {
      if (loading) return;
      loading = true;
      moreBtn.disabled = true;
      moreBtn.textContent = "Loading…";
      try {
        const res = await fetch(`api/runs?limit=${PAGE}&offset=${offset}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rows = await res.json();
        allRows.push(...rows);
        offset += rows.length;
        render();
        if (rows.length < PAGE) {
          moreBtn.remove();
        } else {
          moreBtn.disabled = false;
          moreBtn.textContent = "Show 100 more";
        }
      } catch (err) {
        statusEl.textContent = "Couldn't load logs: " + err.message;
        moreBtn.disabled = false;
        moreBtn.textContent = "Retry";
      } finally {
        loading = false;
      }
    }

    moreBtn.addEventListener("click", loadMore);
    loadMore();
  </script>
</body>

</html>
