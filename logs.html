<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event log — Unstable Truck</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 20px;
      background: #0f1216;
      color: #d6dbe2;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 14px;
    }
    h1 { font-size: 15px; font-weight: 600; color: #f0f2f5; margin: 0; }
    .back-btn {
      flex: none;
      padding: 6px 14px;
      font: inherit;
      color: #d6dbe2;
      text-decoration: none;
      background: #1c222b;
      border: 1px solid #2c3542;
      border-radius: 6px;
    }
    .back-btn:hover { background: #232b36; }
    table { border-collapse: collapse; width: 100%; }
    th, td {
      text-align: left;
      padding: 6px 12px 6px 0;
      border-bottom: 1px solid #1e242d;
      white-space: nowrap;
    }
    th { color: #8a94a3; font-weight: 600; }
    td.seed, td.player { white-space: normal; word-break: break-all; }
    td.comment { white-space: normal; word-break: break-word; color: #b6bec9; }
    .s-finished { color: #55e08a; }
    .s-cargo_fell_off { color: #ff6f6f; }
    .s-out_of_bounds { color: #f2c14e; }
    .s-started { color: #8a94a3; }
    .s-meta { color: #8fa0c0; }
    .d-easy { color: #55e08a; }
    .d-hard { color: #ff6f6f; }
    #more {
      margin: 18px 0 0;
      padding: 8px 18px;
      font: inherit;
      color: #d6dbe2;
      background: #1c222b;
      border: 1px solid #2c3542;
      border-radius: 6px;
      cursor: pointer;
    }
    #more:hover { background: #232b36; }
    #more[disabled] { opacity: 0.5; cursor: default; }
    #status { color: #8a94a3; margin-top: 12px; }
    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    #filters label {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 0.85rem;
      color: #8a94a3;
    }
    #filters input {
      padding: 5px 8px;
      font: inherit;
      font-size: 0.85rem;
      color: #d6dbe2;
      background: #10141a;
      border: 1px solid #2c3542;
      border-radius: 6px;
      min-width: 170px;
    }
    #filter-clear {
      padding: 5px 10px;
      font: inherit;
      font-size: 0.85rem;
      color: #d6dbe2;
      background: #1c222b;
      border: 1px solid #2c3542;
      border-radius: 6px;
      cursor: pointer;
    }
    #filter-clear:hover { background: #232b36; }
    td.player { cursor: pointer; }
    td.player:hover { text-decoration: underline; }
    #gate {
      max-width: 300px;
      margin: 40px auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #gate input {
      padding: 8px 10px;
      font: inherit;
      color: #d6dbe2;
      background: #10141a;
      border: 1px solid #2c3542;
      border-radius: 6px;
    }
    #gate button {
      padding: 8px 14px;
      font: inherit;
      color: #d6dbe2;
      background: #1c222b;
      border: 1px solid #2c3542;
      border-radius: 6px;
      cursor: pointer;
    }
    #gate button:hover { background: #232b36; }
    #gate-error { color: #ff8f8f; margin: 0; }
    .hidden { display: none; }
  </style>
</head>

<body>
  <header>
    <h1>Event log — newest first</h1>
    <a class="back-btn" href=".">← Back to game</a>
  </header>
  <form id="gate" class="hidden">
    <p id="gate-message">This log is for admins. Log in to read it.</p>
    <input type="text" id="gate-username" placeholder="Username" autocomplete="username" autocapitalize="off"
      spellcheck="false" />
    <input type="password" id="gate-password" placeholder="Password" autocomplete="current-password" />
    <button type="submit" id="gate-submit">Log in</button>
    <p id="gate-error" class="hidden"></p>
  </form>

  <div id="log-view" class="hidden">
  <div id="filters">
    <label>Include player
      <input type="text" id="filter-include" placeholder="e.g. Racer, Stranger" autocomplete="off" />
    </label>
    <label>Exclude player
      <input type="text" id="filter-exclude" placeholder="e.g. Lewistrick" autocomplete="off" />
    </label>
    <button id="filter-clear" type="button">Clear</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Player</th>
        <th>Seed</th>
        <th>Difficulty</th>
        <th>Status</th>
        <th>Collected</th>
        <th>Comment</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="status"></p>
  <button id="more" type="button">Show 100 more</button>
  </div>

  <script>
    const PAGE = 100;
    const RUN_OUTCOMES = new Set(["started", "finished", "cargo_fell_off", "out_of_bounds"]);
    const rowsEl = document.getElementById("rows");
    const moreBtn = document.getElementById("more");
    const statusEl = document.getElementById("status");
    const includeEl = document.getElementById("filter-include");
    const excludeEl = document.getElementById("filter-exclude");
    const clearBtn = document.getElementById("filter-clear");
    const FILTER_KEY = "unstable-truck:log-filter";
    const AUTH_KEY = "unstable-truck:auth";
    const gateEl = document.getElementById("gate");
    const gateMessage = document.getElementById("gate-message");
    const gateUsername = document.getElementById("gate-username");
    const gatePassword = document.getElementById("gate-password");
    const gateSubmit = document.getElementById("gate-submit");
    const gateError = document.getElementById("gate-error");
    const logView = document.getElementById("log-view");

    function storedToken() {
      try {
        return JSON.parse(localStorage.getItem(AUTH_KEY) || "null")?.token ?? null;
      } catch {
        return null;
      }
    }

    function authHeaders() {
      const token = storedToken();
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    function showGate(message) {
      gateMessage.textContent = message;
      gateEl.classList.remove("hidden");
      logView.classList.add("hidden");
      gateUsername.focus();
    }

    function showLog() {
      if (gateEl.parentNode) gateEl.remove();
      logView.classList.remove("hidden");
    }

    gateEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      gateError.classList.add("hidden");
      gateSubmit.disabled = true;
      try {
        const res = await fetch("api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: gateUsername.value.trim(), password: gatePassword.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.token) throw new Error(data.error || `HTTP ${res.status}`);
        localStorage.setItem(AUTH_KEY, JSON.stringify({ token: data.token, account: data.user }));
        gatePassword.value = "";
        showLog();
        resetAndLoad();
      } catch (err) {
        gateError.textContent = err.message;
        gateError.classList.remove("hidden");
      } finally {
        gateSubmit.disabled = false;
      }
    });

    let allRows = [];
    let offset = 0;
    let loading = false;

    function cell(text, className) {
      const td = document.createElement("td");
      td.textContent = text;
      if (className) td.className = className;
      return td;
    }

    function filterTerms(input) {
      return input.value.toLowerCase().split(",").map((t) => t.trim()).filter(Boolean);
    }

    function filterQueryParams() {
      const inc = filterTerms(includeEl);
      const exc = filterTerms(excludeEl);
      const parts = [];
      if (inc.length > 0) parts.push("include=" + encodeURIComponent(inc.join(",")));
      if (exc.length > 0) parts.push("exclude=" + encodeURIComponent(exc.join(",")));
      return parts.length > 0 ? "&" + parts.join("&") : "";
    }

    function render() {
      rowsEl.textContent = "";
      for (const r of allRows) {
        const tr = document.createElement("tr");
        const when = new Date(r.createdAt);
        tr.appendChild(cell(isNaN(when) ? r.createdAt : when.toLocaleString()));
        const isRun = RUN_OUTCOMES.has(r.status);
        const player = cell(r.nickname, "player");
        player.title = "Click to filter to this player";
        player.addEventListener("click", () => {
          includeEl.value = includeEl.value === r.nickname ? "" : r.nickname;
          onFilterChange();
        });
        tr.appendChild(player);
        tr.appendChild(cell(r.seed, "seed"));
        const diffClass = r.difficulty === "easy" ? "d-easy" : r.difficulty === "hard" ? "d-hard" : "";
        tr.appendChild(cell(r.difficulty ?? "", diffClass));
        tr.appendChild(cell(r.status, isRun ? "s-" + r.status : "s-meta"));
        tr.appendChild(cell(isRun ? String(r.collected) : ""));
        tr.appendChild(cell(r.comment ?? "", "comment"));
        rowsEl.appendChild(tr);
      }
      statusEl.textContent = allRows.length > 0 ? `${allRows.length} row(s) loaded` : "No runs logged yet.";
    }

    function resetAndLoad() {
      allRows = [];
      offset = 0;
      loadMore();
    }

    let filterTimeout = null;
    function onFilterChange() {
      localStorage.setItem(FILTER_KEY, JSON.stringify({ inc: includeEl.value, exc: excludeEl.value }));
      clearTimeout(filterTimeout);
      filterTimeout = setTimeout(resetAndLoad, 300);
    }

    try {
      const saved = JSON.parse(localStorage.getItem(FILTER_KEY) || "{}");
      includeEl.value = saved.inc || "";
      excludeEl.value = saved.exc || "";
    } catch {
      /* ignore */
    }

    includeEl.addEventListener("input", onFilterChange);
    excludeEl.addEventListener("input", onFilterChange);
    clearBtn.addEventListener("click", () => {
      includeEl.value = "";
      excludeEl.value = "";
      onFilterChange();
    });

    async function loadMore() {
      if (loading) return;
      loading = true;
      moreBtn.disabled = true;
      moreBtn.textContent = "Loading…";
      try {
        const res = await fetch(`api/runs?limit=${PAGE}&offset=${offset}${filterQueryParams()}`, { headers: authHeaders() });
        if (res.status === 401 || res.status === 403) {
          showGate(
            res.status === 403
              ? "That account isn't an admin. Log in with one that is."
              : "This log is for admins. Log in to read it.",
          );
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        showLog();
        const rows = await res.json();
        allRows.push(...rows);
        offset += rows.length;
        render();
        if (rows.length < PAGE) {
          moreBtn.remove();
        } else {
          moreBtn.disabled = false;
          moreBtn.textContent = "Show 100 more";
        }
      } catch (err) {
        statusEl.textContent = "Couldn't load logs: " + err.message;
        moreBtn.disabled = false;
        moreBtn.textContent = "Retry";
      } finally {
        loading = false;
      }
    }

    moreBtn.addEventListener("click", loadMore);
    loadMore();
  </script>
</body>

</html>
