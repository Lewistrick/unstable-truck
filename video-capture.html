<!DOCTYPE html>
<html>
<head><style>html,body{margin:0;overflow:hidden;background:#000}</style></head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { generateLevel } from "./dist/level/generate.js";
import { GameSession } from "./dist/game/session.js";
import { renderWorld, updateCamera } from "./dist/game/render.js";
import { FIXED_DT } from "./dist/physics/constants.js";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let session, camera, level, inputLog, logIndex, held, trailLeft;
let simTimeMs = 0;
performance.now = () => simTimeMs;

window.__captureInit = (cfg) => {
  canvas.width = cfg.width;
  canvas.height = cfg.height;
  level = generateLevel(cfg.seed);
  session = new GameSession(level, { difficulty: cfg.difficulty });
  camera = { x: session.truck.pos.x, y: session.truck.pos.y };
  inputLog = cfg.inputLog;
  logIndex = 0;
  held = false;
  simTimeMs = 0;
  trailLeft = 120;
  paint();
  return { totalTicks: Math.round(cfg.time / FIXED_DT) };
};

window.__captureStep = () => {
  simTimeMs += FIXED_DT * 1000;
  if (session.status !== "playing") {
    if (--trailLeft <= 0) return { done: true, tick: session.currentTick };
    updateCamera(camera, session.truck, FIXED_DT);
    paint();
    return { done: false, tick: session.currentTick };
  }
  while (logIndex < inputLog.length && inputLog[logIndex] <= session.currentTick) {
    held = !held;
    logIndex++;
  }
  session.update(FIXED_DT, held);
  updateCamera(camera, session.truck, FIXED_DT);
  paint();
  return { done: false, tick: session.currentTick };
};

function paint() {
  renderWorld(ctx, level, session.truck, session.cargoBoxes, session.visited, [], camera, canvas.width, canvas.height);
  drawHUD();
}

function drawHUD() {
  const stab = session.stability;
  const timeStr = fmtTime(session.elapsed);

  ctx.save();
  ctx.font = "bold 22px system-ui, sans-serif";
  const tw = ctx.measureText(timeStr).width;
  const pillW = tw + 110;

  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.beginPath();
  ctx.roundRect(14, 14, pillW, 36, 8);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.textBaseline = "middle";
  ctx.fillText(timeStr, 26, 32);

  const barX = tw + 38;
  const barW = 72;
  const barH = 10;
  const barY = 27;
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.beginPath();
  ctx.roundRect(barX, barY, barW, barH, 5);
  ctx.fill();
  const fill = Math.max(0, stab / 100);
  ctx.fillStyle = stab > 50 ? "#22c55e" : stab > 25 ? "#f59e0b" : "#ef4444";
  ctx.beginPath();
  ctx.roundRect(barX, barY, barW * fill, barH, 5);
  ctx.fill();

  ctx.restore();
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m > 0 ? `${m}:${sec.toFixed(2).padStart(5, "0")}` : `${sec.toFixed(2)}s`;
}

window.__captureReady = true;
</script>
</body>
</html>
